[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[build.environment]
  NODE_VERSION = "20"

# The function must NOT declare a `path` of its own, or this rewrite target stops
# existing and every check 404s. See the config block in netlify/functions/analyze.mjs.
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/cars/bmw-3-series"
  to = "/cars/bmw-330i/"
  status = 301
  force = true

[[redirects]]
  from = "/cars/bmw-3-series/*"
  to = "/cars/bmw-330i/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
